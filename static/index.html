<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hipodcast · 播客逐字稿 AI 加工</title>
<style>
  :root {
    --bg:#F6F1E7;        /* 暖白纸底 */
    --card:#FFFDF7;      /* 卡片：更亮的暖白 */
    --line:#E3D9C6;      /* 柔和的暖色描边 */
    --fg:#33302A;        /* 暖墨色正文 */
    --mut:#8C8474;       /* 暖灰辅助文字 */
    --acc:#A8552E;       /* 赭石/陶土主色 */
    --acc-soft:#F0E4D6;  /* 主色的浅色填充 */
    --ok-bg:#E6EEDF; --ok-fg:#4F6B3A;
    --no-bg:#F3E2D8; --no-fg:#A8552E;
  }
  * { box-sizing:border-box; }
  /* 衬线字体：中文用宋体/思源宋体族，西文用 Georgia 系 */
  body { margin:0;
    font-family:Georgia,"Times New Roman","Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    background:var(--bg); color:var(--fg); line-height:1.8;
    -webkit-font-smoothing:antialiased; }
  header { padding:34px 22px 10px; max-width:820px; margin:0 auto; }
  h1 { font-size:30px; margin:0 0 6px; font-weight:600; letter-spacing:.3px; }
  h1 .em { color:var(--acc); }
  .sub { color:var(--mut); font-size:15px; font-style:italic; }
  main { max-width:820px; margin:0 auto; padding:14px 22px 72px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px;
          padding:22px 24px; margin:18px 0; box-shadow:0 1px 2px rgba(120,90,50,.04); }
  .step { font-size:13px; color:var(--acc); font-weight:700; margin-bottom:14px;
          letter-spacing:1.5px; text-transform:uppercase; }
  textarea { width:100%; min-height:150px; resize:vertical; background:#FFFEFB; color:var(--fg);
             border:1px solid var(--line); border-radius:5px; padding:14px; font-size:16px; line-height:1.85;
             font-family:inherit; }
  textarea:focus, input[type=text]:focus, select:focus { outline:none; border-color:var(--acc); }
  input[type=text] { width:100%; background:#FFFEFB; color:var(--fg); border:1px solid var(--line);
             border-radius:5px; padding:12px 14px; font-size:15px; font-family:inherit; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:transparent;
         color:var(--mut); cursor:pointer; font-size:14px; font-family:inherit; }
  .tab.active { background:var(--acc-soft); color:var(--acc); border-color:var(--acc); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  button.act { padding:11px 20px; border-radius:5px; border:none; cursor:pointer; font-size:15px;
               font-weight:600; font-family:inherit; transition:opacity .15s; }
  button.act:hover { opacity:.88; }
  .primary { background:var(--acc); color:#FFF9F2; }
  .ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  .ghost:hover { border-color:var(--acc); opacity:1; }
  select { background:#FFFEFB; color:var(--fg); border:1px solid var(--line); border-radius:5px;
           padding:10px; font-size:15px; font-family:inherit; cursor:pointer; }
  .hint { font-size:13.5px; color:var(--mut); margin-top:10px; }
  .badge { font-size:12px; padding:2px 9px; border-radius:999px; margin-left:8px; }
  .ok { background:var(--ok-bg); color:var(--ok-fg); }
  .no { background:var(--no-bg); color:var(--no-fg); }
  #result { white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.9; }
  .spinner { display:none; font-size:14px; color:var(--acc); margin-top:12px; font-style:italic; }
  .err { color:#A8552E; font-size:14px; margin-top:10px; }
  .hide { display:none; }
</style>
</head>
<body>
<header>
  <h1><span class="em">Hipodcast</span></h1>
  <div class="sub">逐字稿 → 书面化 · 总结 · 翻译 → 导出 Markdown</div>
  <div class="sub" style="margin-top:6px;">
    DeepSeek <span id="b-ds" class="badge no">检测中</span>
    阿里云转写 <span id="b-dash" class="badge no">检测中</span>
  </div>
</header>

<main>
  <!-- 第 1 步：来源 -->
  <div class="card">
    <div class="step">第 1 步 · 来源</div>
    <div class="tabs">
      <button class="tab active" data-tab="paste">粘贴文字稿</button>
      <button class="tab" data-tab="audio">音频链接转写</button>
    </div>
    <div id="tab-paste">
      <div class="hint">粘贴任意文字到下面的「逐字稿」框，或直接选一个本地文件载入：</div>
      <div class="row" style="margin-top:10px;">
        <label class="act ghost" for="fileInput" style="cursor:pointer;">📄 选择本地文件</label>
        <input type="file" id="fileInput" accept=".md,.txt,.srt,.vtt,text/plain" style="display:none;" />
        <span class="hint" id="fileName" style="margin:0;">支持 .md / .txt / .srt / .vtt</span>
      </div>
    </div>
    <div id="tab-audio" class="hide">
      <input type="text" id="audioUrl" placeholder="粘贴音频/播客单集的 mp3 链接，例如 https://.../episode.mp3" />
      <div class="row" style="margin-top:10px;">
        <button class="act primary" id="btnTranscribe">开始转写</button>
        <span class="hint" style="margin:0;">需要阿里云转写 key；长音频可能要等几分钟。</span>
      </div>
      <div class="spinner" id="spinTr">⏳ 转写中，长音频请耐心等待…</div>
      <div class="err" id="errTr"></div>
    </div>
  </div>

  <!-- 第 2 步：逐字稿 -->
  <div class="card">
    <div class="step">第 2 步 · 逐字稿（可手动编辑）</div>
    <textarea id="transcript" placeholder="转写结果会出现在这里；也可以直接粘贴文字。"></textarea>
    <div class="hint" id="trCount">字数：0</div>
  </div>

  <!-- 第 3 步：AI 加工 -->
  <div class="card">
    <div class="step">第 3 步 · AI 加工</div>
    <div class="row">
      <button class="act primary" data-mode="polish">书面化改写</button>
      <button class="act primary" data-mode="summarize">提炼总结</button>
      <button class="act primary" data-mode="translate">翻译为</button>
      <select id="lang">
        <option>英文</option><option>中文</option><option>日文</option>
        <option>韩文</option><option>法文</option><option>德文</option>
      </select>
      <label style="font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="hifi" /> 高保真（更小块、更准、更慢，适合硬核内容）
      </label>
    </div>
    <div class="row" style="margin-top:10px;">
      <span class="hint" style="margin:0;">书面化风格：</span>
      <select id="style">
        <option value="voiced">保留原声（去填充词，留口癖语气）</option>
        <option value="readable">深度整理（洗成好读的文章）</option>
      </select>
    </div>
    <div class="spinner" id="spinPr">⏳ 处理中（长稿会自动分段，逐块处理，请稍候）…</div>
    <div class="err" id="errPr"></div>
  </div>

  <!-- 第 4 步：结果与导出 -->
  <div class="card">
    <div class="step">第 4 步 · 结果与导出</div>
    <div id="result" class="hint">结果会显示在这里。</div>
    <div class="row" style="margin-top:14px;">
      <button class="act ghost" id="btnCopy">复制</button>
      <button class="act ghost" id="btnExport">导出 Markdown</button>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let lastResult = "", lastMode = "";

// 配置就绪状态
fetch("/api/config").then(r=>r.json()).then(c=>{
  const ds=$("#b-ds"), dash=$("#b-dash");
  ds.textContent = c.deepseek_ready ? "已就绪" : "未配置";
  ds.className = "badge " + (c.deepseek_ready?"ok":"no");
  dash.textContent = c.dashscope_ready ? "已就绪" : "未配置";
  dash.className = "badge " + (c.dashscope_ready?"ok":"no");
});

// tab 切换
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  const v=t.dataset.tab;
  $("#tab-paste").classList.toggle("hide", v!=="paste");
  $("#tab-audio").classList.toggle("hide", v!=="audio");
});

// 字数统计
$("#transcript").addEventListener("input", ()=> $("#trCount").textContent="字数："+$("#transcript").value.length);

// 载入本地文件（纯浏览器读取，文件不会上传到任何服务器）
$("#fileInput").addEventListener("change", e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let txt=reader.result;
    // .srt/.vtt 字幕：去掉时间轴和序号行，只留文字
    if(/\.(srt|vtt)$/i.test(file.name)){
      txt=txt.split(/\r?\n/).filter(l=>!/^\d+$/.test(l.trim()) && !/-->/.test(l) && l.trim()!=="WEBVTT").join("\n");
    }
    $("#transcript").value=txt.trim();
    $("#trCount").textContent="字数："+$("#transcript").value.length;
    $("#fileName").textContent="已载入："+file.name+"（"+$("#transcript").value.length+" 字）";
  };
  reader.readAsText(file,"utf-8");
});

// 转写
$("#btnTranscribe").onclick = async ()=>{
  const url=$("#audioUrl").value.trim();
  $("#errTr").textContent="";
  if(!url){ $("#errTr").textContent="请先填音频链接。"; return; }
  $("#spinTr").style.display="block"; $("#btnTranscribe").disabled=true;
  try{
    const r=await fetch("/api/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({audio_url:url})});
    const d=await r.json();
    if(d.error){ $("#errTr").textContent=d.error; }
    else { $("#transcript").value=d.transcript; $("#trCount").textContent="字数："+d.transcript.length; }
  }catch(e){ $("#errTr").textContent="请求失败："+e; }
  $("#spinTr").style.display="none"; $("#btnTranscribe").disabled=false;
};

// AI 加工
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=async ()=>{
  const text=$("#transcript").value.trim();
  $("#errPr").textContent="";
  if(!text){ $("#errPr").textContent="请先在第 2 步提供逐字稿。"; return; }
  const mode=b.dataset.mode; lastMode=mode;
  const spin=$("#spinPr"); spin.style.display="block"; spin.textContent="⏳ 准备中…";
  document.querySelectorAll("[data-mode]").forEach(x=>x.disabled=true);
  try{
    const r=await fetch("/api/process",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text, mode, target_lang:$("#lang").value,
        high_fidelity:$("#hifi").checked, style:$("#style").value})});
    // 边读边显示进度（NDJSON：每行一个事件）
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n"); buf=lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        const ev=JSON.parse(line);
        if(ev.type==="start"){ spin.textContent=`⏳ 共 ${ev.total} 块，开始处理…`; }
        else if(ev.type==="progress"){
          const pct=Math.round(ev.done/ev.total*100);
          spin.textContent=`⏳ ${ev.label}（${pct}%）`;
        }
        else if(ev.type==="done"){
          lastResult=ev.result; $("#result").textContent=ev.result; $("#result").classList.remove("hint");
          if(ev.warnings && ev.warnings.length){ $("#errPr").innerHTML="⚠️ 完整度提醒：<br>"+ev.warnings.join("<br>"); }
        }
        else if(ev.type==="error"){ $("#errPr").textContent=ev.error; }
      }
    }
  }catch(e){ $("#errPr").textContent="请求失败："+e; }
  spin.style.display="none";
  document.querySelectorAll("[data-mode]").forEach(x=>x.disabled=false);
});

// 复制
$("#btnCopy").onclick=()=>{ if(lastResult){ navigator.clipboard.writeText(lastResult); $("#btnCopy").textContent="已复制 ✓"; setTimeout(()=>$("#btnCopy").textContent="复制",1500);} };

// 导出 Markdown
$("#btnExport").onclick=()=>{
  if(!lastResult){ alert("还没有结果可导出。"); return; }
  const titleMap={polish:"书面化稿",summarize:"内容总结",translate:"翻译稿"};
  const md = `# ${titleMap[lastMode]||"Hipodcast 导出"}\n\n> 由 Hipodcast 生成 · ${new Date().toLocaleString()}\n\n${lastResult}\n`;
  const blob=new Blob([md],{type:"text/markdown"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`hipodcast-${lastMode}-${Date.now()}.md`;
  a.click();
};
</script>
</body>
</html>
